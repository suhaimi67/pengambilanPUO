<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My TVET Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="dashboard">
    <h1>My TVET Dashboard</h1>

    <!-- Summary Cards -->
    <div class="cards">
      <div class="card">
        <span class="icon">📚</span>
        <div class="label">Kursus Didaftar</div>
        <div class="value">5</div>
      </div>
      <div class="card">
        <span class="icon">✅</span>
        <div class="label">Kursus Selesai</div>
        <div class="value">3</div>
      </div>
      <div class="card">
        <span class="icon">🏅</span>
        <div class="label">Sijil Diterima</div>
        <div class="value">2</div>
      </div>
    </div>

    <!-- Checklist -->
    <div class="checklist">
      <h2>Senarai Semak</h2>
      <ul>
        <li>
          <input type="checkbox" id="item1" />
          <label for="item1">Hantar borang pendaftaran</label>
        </li>
        <li>
          <input type="checkbox" id="item2" />
          <label for="item2">Bayar yuran kursus</label>
        </li>
        <li>
          <input type="checkbox" id="item3" />
          <label for="item3">Hadiri sesi orientasi</label>
        </li>
        <li>
          <input type="checkbox" id="item4" />
          <label for="item4">Lengkapkan modul pertama</label>
        </li>
      </ul>
    </div>

  </div>

</body>
</html>
